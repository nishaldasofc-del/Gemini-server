services:
  - type: web
    name: sunsetai-gemini-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: MODEL_BLAZING
        value: gemini-2.5-flash-lite
      - key: MODEL_FAST
        value: gemini-2.5-flash
      - key: MODEL_BALANCED
        value: gemini-2.5-flash
